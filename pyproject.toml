[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typed-composition-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jinja2>=3.1",
    "litellm>=1.89.3",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = ["pytest", "openai"]
