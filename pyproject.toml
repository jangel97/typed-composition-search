[project]
name = "typed-composition-search"
version = "0.1.0"
description = "Typed capability graph for MCP tool filtering via bidirectional reachability"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typed_composition_search"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8.0"]
